[project]
name = "id-features"
version = "0.1.0"
description = "Controlled experiments on intrinsic dimension and sparse feature accessibility."
readme = "README.md"
# DADApy currently pulls jaxlib wheels through CPython 3.13, not 3.14.
requires-python = ">=3.11,<3.14"
dependencies = [
    "dadapy>=0.3.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
id-features = "id_features.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/id_features"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
